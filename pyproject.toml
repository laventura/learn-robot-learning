[project]
name = "rlc"
version = "0.1.0"
description = "Code for the Learning Robot Learning site"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
]

[dependency-groups]
site = [
    "matplotlib>=3.11",
    "plotly>=7.1",
    "ipykernel>=7.3",
    "nbformat>=5.11",
    "nbclient>=0.11",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=9.1",
    "uv_build>=0.12,<0.13",
]
# Used only by tools/check_snippets.py; pages never import torch (CLAUDE.md §3).
# On macOS the PyPI wheel is the CPU build.
torch = [
    "torch>=2.9",
]
# Manim Community Edition, used only by tools/render_animations.py (CLAUDE.md §6.3a).
# Pinned exactly; pycairo builds from source and needs Homebrew cairo + pkg-config.
anim = [
    "manim==0.22.0",
]

[tool.uv]
# `uv sync` is exact: a group missing here is uninstalled by the next plain sync.
default-groups = ["site", "dev", "torch", "anim"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
