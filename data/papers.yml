# One entry per paper (CLAUDE.md §6.5). Rendered by rlc.page.paper_cards and papers.qmd.
#
# Source: the course page's "Paper Discussion" column (fetched 2026-10-12), in its order.
# Authors are from each PDF's first page. venue/year come from the PDF, arXiv's metadata,
# or Semantic Scholar, and are the published version's where one exists (so the year can
# differ from the arXiv year the course page shows). TODO(venue) marks venues none of
# these sources confirmed. summary/contributions/connects_to are written with the week.
#
#   role: discussion = listed on the course page; lecture = key paper cited in the lecture

# --- Week 1 · Introduction to Robot Learning ------------------------------
# No discussion papers this week; these are the papers the lecture relies on.
- id: open-x-embodiment
  role: lecture
  weeks: [1, 9]
  title: "Open X-Embodiment: Robotic Learning Datasets and RT-X Models"
  authors: "Open X-Embodiment Collaboration"
  year: 2024
  venue: "ICRA"             # as given on the lecture slide (Best Conference Paper Award)
  url: https://arxiv.org/abs/2310.08864
  summary: "Pools robot-learning data sets from many labs into one standardized collection and trains a single policy on all of it. The question is whether robot learning can follow the recipe of vision and language: one large model trained on diverse data from many robots, rather than one model per robot and task."
  contributions:
    - "A data set of more than a million robot trajectories from 22 robot embodiments, contributed by 21 institutions (Sec. I, Fig. 1)."
    - "RT-1-X and RT-2-X, versions of RT-1 and RT-2 trained on the mixture (Sec. IV)."
    - "Positive transfer: RT-1-X's mean success rate is 50% higher than that of either the original method for each data set or RT-1 (Fig. 4)."
  connects_to: "Week 1: the lecture's case for generalist robot policies and for data as the bottleneck, and the worked example on data-set sizes. Week 9: the data behind Octo and CrossFormer, and the positive transfer this page's first toy reproduces."

- id: rt-2
  role: lecture
  weeks: [1]
  title: "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control"
  authors: "Brohan et al."
  year: 2023
  venue: "CoRL"             # PMLR 229:2165-2183 (7th Conference on Robot Learning, 2023)
  url: https://arxiv.org/abs/2307.15818
  summary: "Takes a vision-language model trained on web data and fine-tunes it to output robot actions written as text tokens, alongside its usual web tasks. The resulting vision-language-action model (VLA) follows commands that never appear in the robot data and can do simple reasoning about which object to pick."
  contributions:
    - "Actions as tokens: each continuous action dimension is cut into 256 uniform bins, so an action becomes 8 integers that the language model writes like words (Sec. 3.2)."
    - "Co-fine-tuning on robot trajectories and web vision-language tasks, so the robot policy keeps the web knowledge (Abstract)."
    - "Over 6,000 evaluation trials showing better generalization to new objects and emergent abilities such as picking the smallest object or an improvised hammer (Abstract)."
  connects_to: "The second toy on this page, which tokenizes a motion the same way, and the lecture's view of robotics as multimodal sequence modeling."

# --- Week 2 · Robot Control & MDPs ---------------------------------------
- id: random-search
  role: discussion
  weeks: [2]
  title: "Simple random search provides a competitive approach to reinforcement learning"
  authors: "Mania, Guy & Recht"
  year: 2018
  venue: "NeurIPS"          # papers.nips.cc 2018, as "Simple random search of static linear policies is competitive for reinforcement learning"
  url: https://arxiv.org/abs/1803.07055
  summary: "Trains static linear policies for continuous control by random search in parameter space: try the weights nudged a little in a random direction and in the opposite one, and move them towards whichever scored higher. No neural network and no gradient of the policy are needed."
  contributions:
    - "Augmented Random Search (ARS): basic random search plus three small changes: scale each step by the spread of the rewards, normalize states with running statistics, and keep only the best-scoring directions (Sec. 1, Algorithm 2)."
    - "Linear policies trained this way matched the sample efficiency of policy-gradient methods on the MuJoCo locomotion benchmarks, with at least 15 times less computation than Evolution Strategies (Abstract, Sec. 1)."
    - "Over a hundred random seeds and many hyperparameter settings, results varied widely, which the authors argue makes the usual few-seed comparisons unreliable (Sec. 1, Sec. 5)."
  connects_to: "The random-search toy on this page runs its Algorithm 1; whether the reward is sparse or dense decides whether those nudges see any signal."

- id: deep-rl-doesnt-work-yet
  role: discussion
  weeks: [2]
  title: "Deep Reinforcement Learning Doesn't Work Yet"
  authors: "Irpan"
  year: 2018
  venue: "blog post"
  url: https://www.alexirpan.com/2018/02/14/rl-hard.html
  summary: "A practitioner's account, from early 2018, of why deep reinforcement learning was hard to use in practice: it needs huge amounts of experience, a reward function that is hard to get right, and it can fail depending on nothing but the random seed."
  contributions:
    - "Sample inefficiency: Rainbow DQN reaches the median human-normalized Atari score after about 18 million frames, roughly 83 hours of play."
    - "Rewards: agents exploit a misspecified reward (the boat-racing example), and even a good reward can leave them stuck in a local optimum."
    - "Instability: in the author's own pendulum experiment, 3 of 10 runs that differed only in their random seed failed."
    - "When it can work: when experience is cheap and nearly unlimited, the problem can be simplified, and the reward is clean and aligned with the goal."
  connects_to: "Why the lecture's choice between sparse and dense rewards matters, and why this site's toys report averages over many seeds."

- id: curiosity
  role: discussion
  weeks: [2]
  title: "Curiosity-driven Exploration by Self-supervised Prediction"
  authors: "Pathak, Agrawal, Efros & Darrell"
  year: 2017
  venue: "ICML"             # the PDF's first page: Proceedings of the 34th ICML, 2017
  url: https://arxiv.org/abs/1705.05363
  summary: "Gives the agent a reward of its own for being surprised: the error of a model that predicts the features of the next state from the current one and the action. The features are trained to keep only what the agent's actions can affect."
  contributions:
    - "The Intrinsic Curiosity Module: an inverse-dynamics model (which action led from this state to that one?) shapes the feature space, and a forward model's prediction error in that space is the curiosity reward (Sec. 2)."
    - "Because the features ignore what the agent cannot influence, unpredictable but irrelevant changes in the scene do not keep attracting it (Abstract, Sec. 1)."
    - "In VizDoom with sparse rewards, curiosity lets an A3C agent reach the goal with far fewer interactions; with no reward at all, it explores a large part of Super Mario Bros Level 1 (Sec. 4)."
    - "Exploration learned on one level makes exploring new levels faster than starting from scratch (Sec. 4.3)."
  connects_to: "One answer to the sparse-reward problem of the lecture and of this page's random-search toy: make up a dense reward from the agent's own prediction errors."

# --- Week 3 · Imitation Learning ------------------------------------------
- id: causal-confusion
  role: discussion
  weeks: [3]
  title: "Causal Confusion in Imitation Learning"
  authors: "de Haan, Jayaraman & Levine"
  year: 2019
  venue: "NeurIPS"
  url: https://arxiv.org/abs/1905.11979
  summary: "Giving a cloned policy more information can make it worse. With extra inputs, a network can reach low training error by relying on a signal that only correlates with the expert's action, such as a dashboard brake light that comes on after the expert brakes, and then fails once its own actions change what it sees."
  contributions:
    - "Names the failure, causal misidentification, and shows it in benchmark control tasks and a driving setting: the policy with more inputs does worse (Sec. 3)."
    - "Trains one network that masks its inputs according to a randomly sampled causal graph, so a single model holds a policy for every hypothesis about which inputs matter (Sec. 4.1)."
    - "Picks the right hypothesis with targeted interventions, using either environment reward or expert queries; in query mode it needs far fewer queries than DAgger (Sec. 2, Sec. 4.2)."
  connects_to: "The lecture's drawer example, where a policy keys on a 10 N force spike instead of the grasped handle, and solved problem 5 on this page."

- id: visual-imitation-representations
  role: discussion
  weeks: [3]
  title: "The Surprising Effectiveness of Representation Learning for Visual Imitation"
  authors: "Pari, Shafiullah, Arunachalam & Pinto"
  year: 2022                # TODO(venue): RSS per Semantic Scholar; year believed 2022 (arXiv Dec 2021)
  venue: "RSS"
  url: https://arxiv.org/abs/2112.01511
  summary: "Splits visual behavior cloning into two separate jobs. First, an image encoder is trained with self-supervised learning on offline images; then, with no further training, the action for a new image is a distance-weighted average of the actions of its nearest demonstration frames in the encoder's feature space (VINN)."
  contributions:
    - "A simple visual imitation method: a self-supervised (BYOL-style) encoder plus non-parametric locally weighted regression over the demonstrations (Sec. I)."
    - "Competitive with end-to-end behavior cloning on offline pushing, stacking and door-opening data (Sec. I)."
    - "On a real robot opening doors from 71 demonstrations: 80% success on doors seen in the data and 40% in new scenes, against 53.3% and 3.3% for the strongest baselines (Sec. I)."
  connects_to: "It keeps the behavioral-cloning recipe of copying demonstrated actions, but moves the hardest part, learning what to look at in an image, into a separate step that needs no action labels."

- id: transporter-networks
  role: discussion
  weeks: [3]
  title: "Transporter Networks: Rearranging the Visual World for Robotic Manipulation"
  authors: "Zeng et al."
  year: 2020
  venue: "CoRL"
  url: https://arxiv.org/abs/2010.14406
  summary: "Treats pick-and-place as choosing pixels in a top-down view of the scene. One network scores every pixel as a place to pick; a second finds where to put the object by matching features cropped around the pick against the rest of the scene, at several rotations."
  contributions:
    - "An action space that keeps the image's spatial layout: actions are pixel locations and rotations, so what is learned at one position carries over to others (Sec. 1, Sec. 3)."
    - "Over 90% success on most of 10 simulated tabletop tasks from 100 demonstrations, where end-to-end baselines struggle with the same data (Sec. 1)."
    - "Its score maps can rank several good pick or place locations at once, so the policy can represent multimodal choices (Abstract)."
    - "Releases Ravens, a simulated benchmark for these tasks (Sec. 1)."
  connects_to: "A score map over pixels is a discretized action distribution, like the binned policy on this page: it can keep several good options as separate peaks instead of averaging them."

- id: dagger
  role: lecture
  weeks: [3]
  title: "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning"
  authors: "Ross, Gordon & Bagnell"
  year: 2011
  venue: "AISTATS"
  url: https://arxiv.org/abs/1011.0686
  summary: "Explains why copying an expert's actions can go badly wrong (a learner's mistakes take it to states the expert never showed, so errors compound) and introduces DAgger: repeatedly run the current policy, have the expert label the states it visits, add them to the data, and retrain. The result is a single deterministic policy with guarantees under the states it actually encounters."
  contributions:
    - "Recalls that a classifier with mistake rate ε on the expert's states can make on the order of εT² mistakes over T steps on its own states (Sec. 1)."
    - "DAgger (Dataset Aggregation), an iterative algorithm that trains one stationary, deterministic policy on the aggregated data from all rounds (Sec. 3)."
    - "Casts imitation as no-regret online learning and shows that any no-regret learner, under reduction assumptions, finds a policy that performs well on the states it induces (Abstract, Sec. 4)."
    - "Experiments on steering in the Super Tux Kart racing game, playing Super Mario Bros., and a sequence-labelling benchmark (Sec. 1, Sec. 5)."
  connects_to: "The εT² bound and the DAgger loop on this page; the road toy measures both."

- id: end-to-end-driving
  role: lecture
  weeks: [3]
  title: "End to End Learning for Self-Driving Cars"
  authors: "Bojarski et al."
  year: 2016
  venue: "arXiv"
  url: https://arxiv.org/abs/1604.07316
  summary: "NVIDIA trained a convolutional network to map the image from a front-facing camera straight to a steering command, using only human driving as supervision. To teach recovery, the training images include views shifted off the lane centre and rotated, each labelled with a corrective steering command."
  contributions:
    - "An end-to-end behavioral cloning system (DAVE-2), with no hand-designed lane detection or path planning, running at 30 frames per second (Abstract)."
    - "Recovery data without crashing: two off-centre views come from left and right cameras, and further shifts and rotations are synthesised by viewpoint transformation (Sec. 2, Sec. 5.2)."
    - "Reports driving autonomously about 98% of the time on a route in New Jersey, measured by counting interventions (Sec. 7.2)."
  connects_to: "The side-camera trick in the Intuition section and solved problem 3: synthetic recovery data instead of an expert in the loop."

- id: play-lmp
  role: lecture
  weeks: [3]
  title: "Learning Latent Plans from Play"
  authors: "Lynch et al."
  year: 2019
  venue: "CoRL"
  url: https://arxiv.org/abs/1903.01973
  summary: "Instead of recording demonstrations of specific tasks, operators teleoperate a robot freely (play). Play-LMP learns from windows of this data relabelled with their own final state as the goal, and organizes the different ways of reaching a goal in a latent plan space, which it samples from at test time."
  contributions:
    - "Argues that play data are cheap (no task segmentation, labels or resets) and rich, covering about 4 times more interaction space than task demonstrations collected in the same time (Abstract)."
    - "Play-LMP: a goal-conditioned latent-variable policy trained with a plan-recognition posterior, a plan-proposal prior and an action decoder (Abstract, Sec. 1)."
    - "On 18 simulated visual manipulation tasks, a single play-trained policy substantially outperforms individual expert-trained policies, and it is more robust to perturbations (Abstract)."
  connects_to: "The goal-conditioned, latent-variable policy behind the ELBO equation on this page, and the lecture's play-data case study."

# --- Week 4 · Reinforcement Learning I ------------------------------------
- id: evolution-strategies
  role: discussion
  weeks: [4]
  title: "Evolution Strategies as a Scalable Alternative to Reinforcement Learning"
  authors: "Salimans, Ho, Chen, Sidor & Sutskever"
  year: 2017
  venue: "arXiv"            # a preprint; no conference or journal version
  url: https://arxiv.org/abs/1703.03864
  summary: "Trains neural-network policies without value functions or backpropagation through time: perturb the weights with Gaussian noise, run each perturbed policy, and move the weights towards the perturbations that scored well. Its appeal is that it parallelizes almost perfectly across many machines."
  contributions:
    - "Workers share random seeds, so each needs to send only one number, the return of its perturbed policy; this scaled to over a thousand workers with near-linear speed-ups (Abstract, Sec. 1)."
    - "With 1,440 CPU workers, ES solved the MuJoCo 3D humanoid task in under 10 minutes (Sec. 1)."
    - "On Atari it matched A3C's final scores on most games using 3 to 10 times as much data, while skipping backpropagation and value functions (Sec. 1)."
    - "As a black-box method it is unaffected by action frequency, delayed rewards and long horizons, and needs no discounting (Abstract)."
  connects_to: "The scaled-up relative of Week 2's random search; this week's value-based methods take the opposite route, exploiting the MDP's step-by-step structure."

- id: pushing-grasping
  role: discussion
  weeks: [4]
  title: "Learning Synergies between Pushing and Grasping with Self-supervised Deep Reinforcement Learning"
  authors: "Zeng, Song, Welker, Lee, Rodriguez & Funkhouser"
  year: 2018
  venue: "IROS"
  url: https://arxiv.org/abs/1803.09956
  summary: "Learns when to push and when to grasp in cluttered piles by Q-learning, rewarded only for successful grasps. Two fully convolutional networks score every pixel of a top-down image as a place to push or to grasp, at several gripper orientations, and the robot takes the best-scoring action."
  contributions:
    - "Actions as pixels: each network outputs a dense map of Q-values over end-effector positions and orientations, so the argmax over actions is an argmax over an image (Abstract, Sec. 1)."
    - "Pushing emerges without being rewarded directly: the Q-function values pushes that make later grasps succeed (Abstract)."
    - "Fully self-supervised by trial and error, it learns in a few hours of training and beats baseline grasping systems in simulation and on a real robot, including on new objects (Abstract)."
  connects_to: "The lecture's example of handling a large action space by discretizing it in a way that matches the geometry of the task."

- id: hil-serl
  role: discussion
  weeks: [4]
  title: "Precise and Dexterous Robotic Manipulation via Human-in-the-Loop Reinforcement Learning"
  authors: "Luo, Xu, Wu & Levine"
  year: 2025
  venue: "Science Robotics" # Sci. Robot. 10, eads5033 (2025), doi 10.1126/scirobotics.ads5033; arXiv 2024
  url: https://arxiv.org/abs/2410.21845
  summary: "A system that trains vision-based manipulation policies with reinforcement learning directly on real robots, in hours. It combines a sample-efficient off-policy RL algorithm with human demonstrations and with corrections a person makes during training, plus a pretrained visual backbone."
  contributions:
    - "Near-perfect success rates and fast cycle times on dynamic, precise and dual-arm tasks within 1 to 2.5 hours of real-world training (Abstract)."
    - "On average twice the success rate and 1.8 times faster execution than imitation-learning baselines and earlier RL approaches (Abstract)."
    - "Off-policy learning lets demonstrations, human corrections and the robot's own experience share one replay buffer (Sec. 1)."
  connects_to: "Off-policy Q-learning with a replay buffer, this week's core machinery, made practical on real hardware; human corrections echo DAgger from Week 3."

- id: dqn
  role: lecture
  weeks: [4]
  title: "Human-level control through deep reinforcement learning"
  authors: "Mnih et al."
  year: 2015
  venue: "Nature"           # Nature 518, 529-533, doi 10.1038/nature14236
  url: https://www.nature.com/articles/nature14236
  summary: "The deep Q-network (DQN): Q-learning with a convolutional network that reads raw game frames and outputs one Q-value per action. One algorithm, network and set of hyperparameters learned 49 Atari games from pixels and the score alone."
  contributions:
    - "Experience replay: store transitions and train on random minibatches of them, which breaks the correlation between consecutive samples (Abstract)."
    - "A separate target network, updated only periodically, computes the learning targets and stabilizes training (Abstract)."
    - "Performance comparable to a professional human games tester across the set of games (Abstract)."
  connects_to: "The lecture's bridge from tabular Q-learning to deep RL, and the source of the replay buffer and target network."

- id: double-dqn
  role: lecture
  weeks: [4]
  title: "Deep Reinforcement Learning with Double Q-learning"
  authors: "van Hasselt, Guez & Silver"
  year: 2016
  venue: "AAAI"             # arXiv comment: AAAI 2016
  url: https://arxiv.org/abs/1509.06461
  summary: "Shows that DQN systematically overestimates action values on Atari, and fixes it by letting the online network choose the next action while the target network scores it."
  contributions:
    - "Evidence that DQN's overestimations are common and harm performance in several Atari games (Abstract)."
    - "Double DQN: a one-line change to the target that decouples choosing the best action from evaluating it (Abstract)."
    - "Lower value estimates and much better scores on several games (Abstract)."
  connects_to: "The overestimation toy on this page: the maximum of noisy estimates is biased upward, and a second, independent estimate removes the bias."

- id: qt-opt
  role: lecture
  weeks: [4]
  title: "QT-Opt: Scalable Deep Reinforcement Learning for Vision-Based Robotic Manipulation"
  authors: "Kalashnikov et al."
  year: 2018
  venue: "CoRL"             # arXiv comment: CoRL 2018 camera ready
  url: https://arxiv.org/abs/1806.10293
  summary: "Closed-loop grasping from an over-the-shoulder RGB camera, learned by Q-learning from over 580,000 real grasp attempts. Continuous actions are handled by picking the action with the cross-entropy method on the Q-function."
  contributions:
    - "A Q-function with over 1.2 million parameters reaches 96% grasp success on unseen objects (Abstract)."
    - "Learned behaviors include regrasping, probing objects, pushing them into better positions before grasping, and reacting to disturbances (Abstract)."
  connects_to: "The lecture's example of the sampling route to the argmax over continuous actions: the cross-entropy method at every control step."

- id: ddpg
  role: lecture
  weeks: [4]
  title: "Continuous control with deep reinforcement learning"
  authors: "Lillicrap et al."
  year: 2016
  venue: "ICLR"             # mlanthology.org/iclr/2016/lillicrap2016iclr-continuous
  url: https://arxiv.org/abs/1509.02971
  summary: "Deep deterministic policy gradient (DDPG): an actor network outputs the action directly and is trained to maximize a Q-network critic, so continuous actions need no search at test time."
  contributions:
    - "An actor-critic, model-free algorithm based on the deterministic policy gradient that carries DQN's ideas to continuous action spaces (Abstract)."
    - "One algorithm, architecture and set of hyperparameters solved more than 20 simulated physics tasks, some directly from pixels (Abstract)."
  connects_to: "The lecture's third route to the argmax over actions: learn it with a second network instead of searching for it."

# --- Week 5 · Reinforcement Learning II -----------------------------------
- id: visuomotor-policies
  role: discussion
  weeks: [5]
  title: "End-to-End Training of Deep Visuomotor Policies"
  authors: "Levine, Finn, Darrell & Abbeel"
  year: 2016
  venue: "JMLR"             # JMLR 17 (2016) 1-40, printed on the arXiv PDF's first page
  url: https://arxiv.org/abs/1504.00702
  summary: "Asks whether perception and control work better when trained together, and trains a convolutional network that maps camera images straight to motor torques on a PR2 robot. A trajectory optimizer that sees the full state during training acts as the teacher; the network, which sees only images and joint angles, learns from it by supervised learning."
  contributions:
    - "Guided policy search turns policy search into supervised learning: simple trajectory-centric RL controllers, trained with the full state, supervise the image-based policy (Abstract, Sec. 1)."
    - "A 7-layer CNN with 92,000 parameters whose spatial softmax turns feature maps into image-space feature points (Sec. 1, Sec. 6.3)."
    - "End-to-end training beats vision trained separately for pose estimation: on the shape-sorting cube, 96.3% success at the training positions against 0% for the pose-prediction baseline (Fig. 9)."
    - "Each task took 156 to 288 five-second trials, about 15 minutes of robot time (Sec. 6.6, Table 4)."
  connects_to: "A policy-search alternative to this week's model-free gradients, and an early case of the lecture's 'privileged information at training time': the teacher sees the state, the deployed policy only pixels."

- id: eureka
  role: discussion
  weeks: [5]
  title: "Eureka: Human-Level Reward Design via Coding Large Language Models"
  authors: "Ma et al."
  year: 2024
  venue: "ICLR"             # "Published as a conference paper at ICLR 2024", on the arXiv PDF
  url: https://arxiv.org/abs/2310.12931
  summary: "A coding language model (GPT-4) writes reward functions as Python code, given the environment's source code and a task description. Candidates are scored by training a policy on each, and the best one, with a written summary of how training went, is fed back so the model can write improved versions."
  contributions:
    - "Its rewards beat expert human-written rewards on 83% of 29 simulated tasks covering 10 robot morphologies, with an average normalized improvement of 52% (Abstract)."
    - "Evolutionary search in the model's context: 16 reward samples per iteration, 5 iterations, 5 independent runs; 'reward reflection' reports per-component training statistics to guide the edits (Sec. 3.2, 3.3)."
    - "With a curriculum, a simulated Shadow Hand learns rapid pen spinning (Abstract)."
    - "Human feedback in words can steer the reward without updating any model weights (Abstract)."
  connects_to: "Every candidate reward is scored by a full PPO training run in GPU simulation (Sec. 4.2): this week's algorithm is the inner loop, and the reward, which the lecture takes as given, becomes the thing optimized."

- id: tacorl
  role: discussion
  weeks: [5]
  title: "Latent Plans for Task-Agnostic Offline Reinforcement Learning"
  authors: "Rosete-Beas, Mees, Kalweit, Boedecker & Burgard"
  year: 2022
  venue: "CoRL"             # "6th Conference on Robot Learning (CoRL 2022)", on the arXiv PDF
  url: https://arxiv.org/abs/2209.08959
  summary: "TACO-RL learns long-horizon, goal-reaching manipulation from a fixed dataset of undirected teleoperated 'play'. A low-level policy learns short latent skills by imitation; a high-level policy, trained by offline RL, picks which latent skill to run next so the skills chain towards a goal image."
  contributions:
    - "Imitation for the short skills, offline RL (Conservative Q-Learning, initialized from the imitation prior) for chaining them, which shortens the horizon the RL part must handle (Abstract, Sec. 4.2)."
    - "Rewards come from hindsight relabeling: states reached later in the same play episode become goals, with deliberately chosen negative goals (Sec. 4.2)."
    - "Two tasks in a row from a single goal image: 27% success against 2.7% for imitation (LMP) and 2.4% for offline RL alone (CQL+HER) (Table 2)."
    - "On a real robot, one visuomotor policy for 25 tasks averages 61% success, against 40% and 11% for the same baselines (Table 4)."
  connects_to: "The far end of this week's on-policy to off-policy arc: an actor-critic that learns from logged data only, never collecting new experience."

- id: reinforce
  role: lecture
  weeks: [5]
  title: "Simple statistical gradient-following algorithms for connectionist reinforcement learning"
  authors: "Williams"
  year: 1992
  venue: "Machine Learning" # Machine Learning 8, 229-256, doi 10.1007/BF00992696
  url: https://doi.org/10.1007/BF00992696
  summary: "Introduces REINFORCE: for networks of stochastic units, adjust each weight by the reward times the gradient of the log-probability of what the unit did. On average this follows the gradient of expected reward, without ever computing that gradient explicitly."
  contributions:
    - "A broad family of update rules whose expected direction is the gradient of expected reinforcement, for immediate rewards and some delayed-reward settings (Abstract)."
    - "Shows how the rules combine with backpropagation (Abstract)."
  connects_to: "The lecture's first policy-gradient algorithm, and the 'full return' estimator in this page's variance toy."

- id: trpo
  role: lecture
  weeks: [5]
  title: "Trust Region Policy Optimization"
  authors: "Schulman, Levine, Moritz, Jordan & Abbeel"
  year: 2015
  venue: "ICML"             # arXiv comment: ICML 2015
  url: https://arxiv.org/abs/1502.05477
  summary: "Derives a policy update with a guarantee that it does not make the policy worse, then approximates it in practice: maximize the importance-weighted advantage subject to a limit on the average KL divergence between old and new policies."
  contributions:
    - "A theoretically justified procedure with monotonic improvement, made practical for large neural-network policies (Abstract)."
    - "Results on simulated swimming, hopping and walking, and on Atari from pixels, with little hyperparameter tuning (Abstract)."
  connects_to: "The lecture's KL-constrained answer to 'how far may one batch move the policy?'"

- id: ppo
  role: lecture
  weeks: [5]
  title: "Proximal Policy Optimization Algorithms"
  authors: "Schulman, Wolski, Dhariwal, Radford & Klimov"
  year: 2017
  venue: "arXiv"            # a preprint; no conference or journal version
  url: https://arxiv.org/abs/1707.06347
  summary: "Replaces TRPO's constraint with a clipped importance ratio inside the objective, so one batch can be used for several epochs of ordinary minibatch gradient steps."
  contributions:
    - "A surrogate objective that allows multiple epochs of minibatch updates per batch, where standard policy gradients take one step per sample (Abstract)."
    - "Keeps some of TRPO's benefits while being simpler to implement and more general (Abstract)."
    - "Outperforms other online policy-gradient methods on simulated locomotion and Atari, balancing sample use, simplicity and wall-clock time (Abstract)."
  connects_to: "The clipped objective this page's reuse toy compares with the unclipped one."

- id: sac
  role: lecture
  weeks: [5]
  title: "Soft Actor-Critic: Off-Policy Maximum Entropy Deep Reinforcement Learning with a Stochastic Actor"
  authors: "Haarnoja, Zhou, Abbeel & Levine"
  year: 2018
  venue: "ICML"             # arXiv comment: ICML 2018
  url: https://arxiv.org/abs/1801.01290
  summary: "An off-policy actor-critic in which the actor maximizes expected reward plus the entropy of its own actions: succeed at the task while acting as randomly as possible."
  contributions:
    - "Combines off-policy updates from a replay buffer with a stochastic actor in the maximum-entropy framework (Abstract)."
    - "State-of-the-art results on continuous-control benchmarks at the time, beating earlier on- and off-policy methods, with low variance across random seeds (Abstract)."
  connects_to: "The lecture's endpoint: a replay buffer like DQN's, an entropy bonus, and the reparameterization trick, which this page's third toy measures."

# --- Week 6 · Generative Models -------------------------------------------
- id: diffuser
  role: discussion
  weeks: [6]
  title: "Planning with Diffusion for Flexible Behavior Synthesis"
  authors: "Janner, Du, Tenenbaum & Levine"
  year: 2022
  venue: "ICML"
  url: https://arxiv.org/abs/2205.09991
  summary: "Instead of learning a dynamics model and handing it to a separate trajectory optimizer, Diffuser trains a diffusion model on whole trajectories, so that planning becomes sampling: start from noise and denoise a full plan at once, nudging the samples towards high reward or towards a required start or goal."
  contributions:
    - "A diffusion model over complete state-action trajectories that refines a whole plan in parallel rather than step by step (Abstract, Fig. 1)."
    - "Recasts classifier-guided sampling as planning for reward and image-style inpainting as planning to fixed start and goal states (Abstract)."
    - "Useful properties for long-horizon tasks: handles sparse rewards, plans for new rewards without retraining, and stitches together pieces of trajectories it has seen into new ones (Sec. 7)."
  connects_to: "Diffusion applied to trajectories instead of single actions, the same move Diffusion Policy makes for action sequences; guidance is a cousin of classifier-free guidance on this page."

- id: implicit-bc
  role: discussion
  weeks: [6]
  title: "Implicit Behavioral Cloning"
  authors: "Florence et al."
  year: 2021
  venue: "CoRL"
  url: https://arxiv.org/abs/2109.00137
  summary: "Rather than a network that outputs the action, Implicit BC learns an energy function over (observation, action) pairs and picks the action with the lowest energy. Because the policy is an argmin, it can represent several equally good actions and sharp jumps, which a regression network smooths over."
  contributions:
    - "Reformulates behavioral cloning with energy-based models and inference-time optimization over actions (Sec. 1, Sec. 7)."
    - "Often outperforms explicit policies trained with mean-squared error or mixture densities, including with image inputs and action spaces of up to 30 dimensions (Abstract, Sec. 7)."
    - "Real-robot tasks from human demonstrations that need about 1 mm precision (Abstract)."
    - "An analysis of why implicit models handle discontinuous and multi-valued functions, and a universal-approximation result for them (Abstract, Sec. 7)."
  connects_to: "Another answer to the averaging problem from Week 3; Diffusion Policy sets itself against both explicit and implicit policies like this one (its Fig. 1)."

- id: dsrl
  role: discussion
  weeks: [6]
  title: "Steering Your Diffusion Policy with Latent Space Reinforcement Learning"
  authors: "Wagenmaker et al."
  year: 2025
  venue: "arXiv"
  url: https://arxiv.org/abs/2506.15799
  summary: "A diffusion policy turns random noise into an action. DSRL keeps the trained policy fixed and instead learns, with reinforcement learning, which input noise to feed it, steering the policy towards actions that earn reward without touching its weights."
  contributions:
    - "Diffusion steering via RL: run RL over the policy's latent-noise space rather than its parameters (Abstract)."
    - "Needs only black-box access to the policy and is sample-efficient enough for real-world improvement (Abstract)."
    - "Shown on simulated benchmarks, real robot tasks, and for adapting pretrained generalist policies (Abstract)."
  connects_to: "The noise a diffusion or flow policy starts from is an input you can choose; Weeks 4–5 supply the RL that does the choosing."

- id: ddpm
  role: lecture
  weeks: [6]
  title: "Denoising Diffusion Probabilistic Models"
  authors: "Ho, Jain & Abbeel"
  year: 2020
  venue: "NeurIPS"
  url: https://arxiv.org/abs/2006.11239
  summary: "Shows that a diffusion model, which learns to undo a gradual noising process step by step, can generate high-quality images. The key practical step is to train the network to predict the noise that was added, with a plain squared error."
  contributions:
    - "High-quality image synthesis from diffusion models, with an FID of 3.17 on unconditional CIFAR-10 (Abstract)."
    - "A link between diffusion models and denoising score matching with Langevin dynamics (Abstract)."
    - "The simplified training objective: predict the added noise with a squared error, L_simple (Sec. 3.4, Eq. 14)."
  connects_to: "The DDPM loss and sampler on this page."

- id: diffusion-policy
  role: lecture
  weeks: [6]
  title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion"
  authors: "Chi et al."
  year: 2023
  venue: "RSS"              # roboticsproceedings.org/rss19/p026; the arXiv link is the extended version cited below
  url: https://arxiv.org/abs/2303.04137
  summary: "Represents a robot's visuomotor policy as a conditional diffusion process: starting from noise, it denoises a whole sequence of future actions, conditioned on the current observations. This handles demonstrations with several valid ways of doing a task, and trains stably."
  contributions:
    - "Across 15 tasks from 4 manipulation benchmarks, an average improvement of 46.9% over prior state-of-the-art methods (Abstract of the extended arXiv version)."
    - "Practical ingredients for real robots: receding-horizon control over predicted action sequences, visual conditioning, and a time-series diffusion transformer (Abstract)."
    - "An analysis of why it works: multimodal action distributions, high-dimensional action sequences, and training stability (Sec. 4)."
  connects_to: "The lecture's main case study and this week's guest speaker's work; the conditional version of the toy on this page."

- id: flow-matching
  role: lecture
  weeks: [6]
  title: "Flow Matching for Generative Modeling"
  authors: "Lipman, Chen, Ben-Hamu, Nickel & Le"
  year: 2023
  venue: "ICLR"             # mlanthology.org/iclr/2023/lipman2023iclr-flow; the arXiv PDF says "Preprint"
  url: https://arxiv.org/abs/2210.02747
  summary: "Trains a continuous normalizing flow by regressing a velocity field along simple, fixed paths from noise to data, with no simulation during training. Diffusion paths are one special case; straight-line (optimal-transport) paths train and sample faster."
  contributions:
    - "Flow Matching: a simulation-free objective that regresses the vector field of chosen conditional probability paths (Abstract)."
    - "Covers Gaussian paths including diffusion's, and finds training diffusion paths with it more robust (Abstract)."
    - "Optimal-transport (straight-line) paths that give faster training and sampling and better results on ImageNet (Abstract)."
  connects_to: "The flow-matching toy on this page, and π0, which generates robot actions this way (Week 9)."

# --- Week 7 · Sequence Modeling and Transformers --------------------------
- id: decision-transformer
  role: discussion
  weeks: [7]
  title: "Decision Transformer: Reinforcement Learning via Sequence Modeling"
  authors: "Chen et al."
  year: 2021
  venue: "NeurIPS"          # Advances in NeurIPS 34 (2021), proceedings.neurips.cc
  url: https://arxiv.org/abs/2106.01345
  summary: "Treats offline reinforcement learning as sequence modeling. A GPT-style causal transformer reads the recent history of (return-to-go, state, action) tokens and is trained, like a language model, to predict the action. At test time you ask for a high return, and it generates actions meant to achieve it: no value function, no policy gradient."
  contributions:
    - "Conditions on returns-to-go, the sum of future rewards, instead of past rewards, so the desired return is set at the start and decremented as rewards arrive (Sec. 3)."
    - "Matches or exceeds model-free offline RL baselines such as CQL on Atari, OpenAI Gym and Key-to-Door, with almost no change to a language-model architecture (Abstract, Sec. 4)."
    - "Context matters: with only the current step (K = 1) Atari scores drop sharply, e.g. Pong from 106.1 to 2.5 (Table 5)."
  connects_to: "This page's view of a robot's history as a token sequence, and its attention toy, which also needs past tokens to act. It also links back to Weeks 4 and 5: return is now an input rather than something to maximize."

- id: aloha
  role: discussion
  weeks: [7]
  title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware"
  authors: "Zhao, Kumar, Levine & Finn"
  year: 2023
  venue: "RSS"              # RSS 2023 program, paper 16 (roboticsconference.org)
  url: https://arxiv.org/abs/2304.13705
  summary: "ALOHA is a two-arm teleoperation system built for under $20k, with leader arms a person backdrives and follower arms that mirror them. ACT (Action Chunking with Transformers) learns from its demonstrations: a transformer predicts the next k joint targets at once from camera images, and overlapping predictions are averaged at execution."
  contributions:
    - "Action chunking: predicting k = 100 actions per query at 50 Hz shortens the task's effective horizon k-fold; success rose from 1% at k = 1 to 44% at k = 100, averaged over four simulated settings without the ensemble (Sec. IV-A, VI-A)."
    - "Temporal ensembling: query every step and average all predictions for the current step with weights exp(-m i), i = 0 the oldest (Sec. IV-A, Algorithm 2)."
    - "Trained as a conditional VAE to cope with noisy, multimodal human demonstrations, which the paper finds essential for precise tasks (Sec. IV-B)."
    - "80-90% success on tasks such as slotting a battery or opening a translucent condiment cup, from 10 minutes of demonstrations per task (Abstract)."
  connects_to: "The action-chunk toy and the hero clip on this page, which compare single-step control, open-loop chunks and ACT's temporal ensemble."

- id: humanoid-next-token
  role: discussion
  weeks: [7]
  title: "Humanoid Locomotion as Next Token Prediction"
  authors: "Radosavovic et al."
  year: 2024
  venue: "NeurIPS"          # NeurIPS 2024 (spotlight), proceedings.neurips.cc
  url: https://arxiv.org/abs/2402.19469
  summary: "Casts humanoid walking as next-token prediction over sensorimotor trajectories. A causal transformer predicts both the next observation and the next action, so it can also learn from trajectories with missing parts, such as human videos without motor commands, by replacing the missing tokens with a learned mask token."
  contributions:
    - "Training data from four sources: neural-network policies, model-based controllers, human motion capture and YouTube videos of people (Sec. 4)."
    - "A full-sized humanoid (Agility Robotics' Digit) walks around San Francisco zero-shot, and the model transfers even when trained on only 27 hours of walking data (Abstract)."
    - "Follows commands never seen in training, such as walking backward (Abstract)."
    - "Predicting states as well as actions lowers tracking error compared with predicting actions only (Table 1d)."
  connects_to: "The lecture's claim that robotics is a sequence-modeling problem, taken literally: the robot's own trajectory is the sentence, and every token is predicted."

- id: transformer
  role: lecture
  weeks: [7]
  title: "Attention Is All You Need"
  authors: "Vaswani et al."
  year: 2017
  venue: "NeurIPS"          # Advances in NIPS 30 (2017), proceedings.neurips.cc paper 7181
  url: https://arxiv.org/abs/1706.03762
  summary: "Introduces the Transformer, an encoder-decoder for sequence-to-sequence tasks built only from attention and feed-forward layers, with no recurrence or convolution. Every token can draw on every other token in one step, and training runs in parallel over the whole sequence."
  contributions:
    - "Scaled dot-product attention and multi-head attention as the only way information moves between positions (Abstract)."
    - "Better translation quality than the best recurrent and convolutional models, while being more parallelizable and much cheaper to train (Abstract)."
    - "The template that GPT-style language models, ViT, VLMs and VLAs all reuse."
  connects_to: "The attention equation boxed on this page and the attention toy, which implements one head and its gradient in NumPy."

- id: vit
  role: lecture
  weeks: [7]
  title: "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale"
  authors: "Dosovitskiy, Beyer et al."
  year: 2021
  venue: "ICLR"             # the arXiv v2 comment: "ICLR camera-ready version"
  url: https://arxiv.org/abs/2010.11929
  summary: "Cuts an image into 16 by 16 pixel patches, projects each patch linearly into a token, adds a position embedding, and feeds the sequence to a standard Transformer. Without any convolutional backbone, the result competes with the best convolutional networks once pre-trained on enough data."
  contributions:
    - "Image patches as tokens: the same interface as words, so images and text can share one sequence (Abstract)."
    - "When pre-trained on large data and transferred to benchmarks such as ImageNet and CIFAR-100, matches or beats strong convolutional networks with substantially less compute to train (Abstract)."
  connects_to: "This page's section on tokenizing images, the step from language models to vision-language models."

- id: chinchilla
  role: lecture
  weeks: [7]
  title: "Training Compute-Optimal Large Language Models"
  authors: "Hoffmann et al."
  year: 2022
  venue: "NeurIPS"          # NeurIPS 2022, as "An Empirical Analysis of Compute-Optimal Large Language Model Training" (mlanthology)
  url: https://arxiv.org/abs/2203.15556
  summary: "Asks how to split a fixed compute budget between model size and training tokens. From over 400 training runs, the answer is to grow both in equal proportion; most large language models of the time were too big for the data they saw."
  contributions:
    - "Over 400 language models, from 70 million to over 16 billion parameters, trained on 5 to 500 billion tokens (Abstract)."
    - "For every doubling of model size, double the training tokens too (Abstract)."
    - "Chinchilla, 70B parameters on 4 times Gopher's data at the same compute, outperforms Gopher (280B) and GPT-3 (175B) on a wide range of tasks (Abstract)."
  connects_to: "The scaling-law equations on this page and the lecture's question of what scale buys in robotics."

- id: fast
  role: lecture
  weeks: [7]
  title: "FAST: Efficient Action Tokenization for Vision-Language-Action Models"
  authors: "Pertsch, Stachowicz et al."
  year: 2025
  venue: "RSS"              # Robotics: Science and Systems XXI, roboticsproceedings.org/rss21/p012
  url: https://arxiv.org/abs/2501.09747
  summary: "Per-dimension, per-step binning, the usual way to turn robot actions into tokens, fails for autoregressive VLAs trained on high-frequency, dexterous data. FAST compresses each action chunk first: a discrete cosine transform, rounding, then byte-pair encoding, which gives a few dense tokens per chunk."
  contributions:
    - "Shows that simple binning performs poorly when learning dexterous skills from high-frequency robot data (Abstract)."
    - "A compression-based tokenizer built on the discrete cosine transform, which lets autoregressive VLAs train on tasks where binning fails completely (Abstract)."
    - "FAST+, a universal tokenizer trained on 1M real robot action trajectories (Abstract)."
    - "With the pi0 VLA, scales to 10k hours of robot data and matches diffusion VLAs while training up to 5 times faster (Abstract)."
  connects_to: "The action-token toy on this page, which runs a small version of the same pipeline next to plain binning. The lecturer is one of the paper's authors."

# --- Week 8 · World Models ------------------------------------------------
- id: unipi
  role: discussion
  weeks: [8]
  title: "Learning Universal Policies via Text-Guided Video Generation"
  authors: "Du et al."
  year: 2023
  venue: "NeurIPS"          # "37th Conference on Neural Information Processing Systems (NeurIPS 2023)", on the arXiv PDF
  url: https://arxiv.org/abs/2302.00111
  summary: "UniPi turns decision making into text-conditioned video generation. A video diffusion model, given the current frame and a task in words, generates a short video of the task being done; a separately trained inverse dynamics model then reads off the actions that move between consecutive generated frames."
  contributions:
    - "Policy as video: images are a shared state space across environments, and text specifies the goal, which supports combining instructions in new ways (Abstract)."
    - "First-frame conditioning ('tiling') and temporal super-resolution keep the generated plan consistent with the scene (Sec. 3.1)."
    - "The inverse dynamics model is trained independently of the video planner, on a separate, smaller data set (Sec. 3.1)."
    - "Pre-training on internet videos lets it produce realistic plans for real-robot tasks not in the robot data (Abstract, Sec. 4.3)."
  connects_to: "The video-action toy on this page, which also pairs a model of what happens next with an inverse dynamics model that decodes actions from it."

- id: dreamer-4
  role: discussion
  weeks: [8]
  title: "Training Agents Inside of Scalable World Models"
  authors: "Hafner, Yan & Lillicrap"
  year: 2025
  venue: "arXiv"            # preprint 2509.24527; no venue found (one search, 2026-10-20)
  url: https://arxiv.org/abs/2509.24527
  summary: "Dreamer 4 learns a transformer world model of Minecraft from video and trains an agent by reinforcement learning inside it. It is the first agent to obtain diamonds in Minecraft purely from offline data, without ever interacting with the game during learning."
  contributions:
    - "A shortcut forcing objective and an efficient transformer give real-time interactive inference on a single GPU (Abstract)."
    - "Learns action conditioning from 2,500 hours of video with only 100 hours of paired actions, reaching over 80% of the accuracy of training with all actions (Fig. 7)."
    - "Obtaining diamonds needs sequences of over 20,000 mouse and keyboard actions from raw pixels; it learns from the 2.5K-hour VPT contractor data set alone (Abstract, Sec. 4.1)."
    - "Outperforms OpenAI's VPT offline agent while using 100 times less data (Sec. 1)."
  connects_to: "The latent world models of this page's Intuition: imagination training without real interaction, here scaled up and pre-trained on action-free video."

- id: dreamzero
  role: discussion
  weeks: [8]
  title: "World Action Models are Zero-shot Policies"
  authors: "Ye et al."
  year: 2026
  venue: "arXiv"            # preprint 2602.15922 (NVIDIA); no venue found (one search, 2026-10-20)
  url: https://arxiv.org/abs/2602.15922
  summary: "DreamZero is a 14-billion-parameter world action model: a video diffusion model, pre-trained on web video, that jointly generates the robot's future camera frames and its actions. Predicting how the world will evolve gives it physical priors that VLAs, built on static image-text models, lack."
  contributions:
    - "Over 2 times better generalization to new tasks and environments than state-of-the-art VLAs in real-robot experiments (Abstract)."
    - "Model and system optimizations give a 38 times inference speed-up, so the 14B autoregressive model runs closed-loop control at about 7 Hz (Sec. 1)."
    - "Video-only demonstrations from other robots or humans improve unseen-task performance by over 42% (relative) with 10–20 minutes of data (Abstract)."
    - "Adapts to a new robot with 30 minutes of play data while keeping zero-shot generalization (Abstract)."
  connects_to: "The page's world action models; its closed-loop inference, which swaps real observations into the model's context, is the 'look' option of this page's puck toy. The guest speaker is a co-author."

- id: visual-foresight
  role: lecture
  weeks: [8]
  title: "Deep Visual Foresight for Planning Robot Motion"
  authors: "Finn & Levine"
  year: 2017
  venue: "ICRA"             # arXiv comment: "ICRA 2017"
  url: https://arxiv.org/abs/1610.00696
  summary: "Combines an action-conditioned video prediction model with model-predictive control. The model, trained on unlabeled data the robot collected itself, predicts how pixels will move under candidate actions; the planner picks the actions whose predicted motion moves a chosen pixel to its goal."
  contributions:
    - "Entirely unlabeled training data: no calibrated camera, instrumented set-up or precise sensing (Abstract)."
    - "A real robot pushes objects, including objects not seen in training (Abstract)."
  connects_to: "The pixel world models at the start of the lecture, and the plan-with-a-model-then-replan loop of this page's puck toy."

- id: ha-world-models
  role: lecture
  weeks: [8]
  title: "World Models"
  authors: "Ha & Schmidhuber"
  year: 2018
  venue: "NeurIPS"          # as "Recurrent World Models Facilitate Policy Evolution", NeurIPS 2018 (papers.nips.cc)
  url: https://arxiv.org/abs/1803.10122
  summary: "A world model in three parts: a VAE that compresses each frame to a latent vector, a recurrent network that predicts the next latent, and a tiny controller acting on both. The controller can be trained entirely inside the model's own 'dream' and transferred back to the real environment."
  contributions:
    - "Unsupervised learning of a compressed spatial and temporal representation of the environment (Abstract)."
    - "Features from the world model make a very small policy sufficient (Abstract)."
    - "A policy trained purely in the hallucinated environment transfers to the actual one (Abstract)."
  connects_to: "The first latent world model in the lecture's lineage, and the drift problem that RSSM later fixes."

- id: planet
  role: lecture
  weeks: [8]
  title: "Learning Latent Dynamics for Planning from Pixels"
  authors: "Hafner et al."
  year: 2019
  venue: "ICML"             # ICML 2019 (icml.cc virtual poster 3764)
  url: https://arxiv.org/abs/1811.04551
  summary: "PlaNet learns a latent dynamics model from images and chooses actions by fast online planning in that latent space. Its recurrent state-space model has both a deterministic and a stochastic part."
  contributions:
    - "The recurrent state-space model (RSSM): deterministic and stochastic transition components (Abstract)."
    - "Latent overshooting, a multi-step variational objective for predicting rewards several steps ahead (Abstract)."
    - "Solves continuous control from pixels with substantially fewer episodes than strong model-free methods (Abstract)."
  connects_to: "The RSSM equations on this page: a learned prior over the next latent, kept close to the posterior by a KL term."

- id: dreamer
  role: lecture
  weeks: [8]
  title: "Dream to Control: Learning Behaviors by Latent Imagination"
  authors: "Hafner, Lillicrap, Ba & Norouzi"
  year: 2020
  venue: "ICLR"             # ICLR 2020 (iclr.cc virtual poster 1737)
  url: https://arxiv.org/abs/1912.01603
  summary: "Dreamer replaces PlaNet's planning at every step with an actor and a critic trained inside the learned world model, by back-propagating value gradients through imagined trajectories."
  contributions:
    - "Learns behaviors purely by latent imagination (Abstract)."
    - "Propagates analytic gradients of learned state values back through imagined trajectories (Abstract)."
    - "Beats existing approaches on 20 visual control tasks in data efficiency, computation time and final performance (Abstract)."
  connects_to: "Amortizing the planner of this page's puck toy into a policy; the start of the Dreamer line that ends in Dreamer 4."

- id: daydreamer
  role: lecture
  weeks: [8]
  title: "DayDreamer: World Models for Physical Robot Learning"
  authors: "Wu, Escontrela, Hafner, Abbeel & Goldberg"
  year: 2022
  venue: "CoRL"             # CoRL 2022 (DBLP)
  url: https://arxiv.org/abs/2206.14176
  summary: "Applies Dreamer, unchanged, to four real robots learning online without simulators."
  contributions:
    - "A quadruped learns to roll off its back, stand up and walk from scratch in 1 hour, and adapts to pushes within 10 minutes (Abstract)."
    - "Two robot arms learn pick and place from camera images and sparse rewards, approaching human performance (Abstract)."
    - "The same hyperparameters in every experiment (Abstract)."
  connects_to: "The lecture's case that imagination training saves real-world trial and error."

- id: mimic-video
  role: lecture
  weeks: [8]
  title: "mimic-video: Video-Action Models for Generalizable Robot Control Beyond VLAs"
  authors: "Pai, Achenbach et al."
  year: 2025
  venue: "arXiv"            # preprint 2512.15692
  url: https://arxiv.org/abs/2512.15692
  summary: "A video-action model: a pre-trained internet-scale video model plans in video space, and a flow-matching action decoder, acting as an inverse dynamics model, turns its latent representation into robot actions."
  contributions:
    - "Argues that vision-language pre-training captures semantics but is blind to physical causality, while video captures both (Abstract)."
    - "10 times better sample efficiency and 2 times faster convergence than traditional VLA architectures (Abstract)."
  connects_to: "The video-action toy on this page and its oracle test. The lecturer is a co-author."

# --- Week 9 · Generalist Robot Policies -----------------------------------
- id: language-conditioned-il
  role: discussion
  weeks: [9]
  title: "Language Conditioned Imitation Learning over Unstructured Data"
  authors: "Lynch & Sermanet"
  year: 2021
  venue: "RSS"              # Robotics: Science and Systems XVII, roboticsproceedings.org/rss17/p047
  url: https://arxiv.org/abs/2005.07648
  summary: "Teaches one network to follow free-form typed instructions on a simulated tabletop, from pixels to continuous control, while asking people to label almost none of the data. Hours of unscripted teleoperated play are cut into windows and relabelled with the window's last frame as its goal; a small fraction is also described in words after the fact, and one policy learns from both kinds of goal."
  contributions:
    - "Multicontext imitation learning: one latent-goal policy trained on several data sets that describe tasks in different ways (goal images, language), each with its own encoder into a shared goal space (Sec. IV-B)."
    - "Language labels on less than 1% of the data, with goal-image relabelling of the rest supplying most of the perception and control (Abstract, Fig. 1)."
    - "68.6% success on single instructions over 18 tasks against 20.0% for language-conditioned cloning of conventional task demos, and 52.1% against 7.1% on four-instruction chains (Table I)."
    - "Feeding instructions through a pretrained multilingual sentence encoder raises success to 74.1% and lets the policy follow unseen synonyms, in 16 languages, without new demonstrations (Table I, Sec. IV-C)."
  connects_to: "The lecture's 'goal-conditioned behavior cloning' with goal images or language, which Octo inherits; and an early answer to this week's data question: label a little, relabel the rest."

- id: gato
  role: discussion
  weeks: [9]
  title: "A Generalist Agent"
  authors: "Reed et al."
  year: 2022
  venue: "TMLR"             # first page: "Published in Transactions on Machine Learning Research (11/2022)"
  url: https://arxiv.org/abs/2205.06175
  summary: "Trains a single 1.2-billion-parameter transformer, with one set of weights, to play Atari, caption images, chat, stack blocks with a real arm and much more. Every modality is turned into tokens from one shared vocabulary, and the model is trained like a language model on the flat token sequences; in context it decides whether to emit text, joystick buttons or joint torques."
  contributions:
    - "One tokenization for everything: text as subwords, images as 16×16 patches, discrete actions as integers, and continuous values mu-law companded into [−1, 1] and cut into 1,024 bins placed after the 32,000 text tokens (Sec. 2.1, App. B)."
    - "A masked next-token loss: only text and action tokens are targets, observation tokens are context only (Sec. 2.3, Eq. 2)."
    - "Tasks are told apart by prompting with a demonstration of the same task rather than a task id (Sec. 2.3)."
    - "Over 450 of its 604 tasks above 50% of the expert's score, from one checkpoint (Sec. 4.1)."
  connects_to: "The lecture's 'robotics as multimodal sequence modeling', in its most literal form, and the ancestor of Octo's tokenized observations; its author was Week 8's guest."

- id: pi-star-06
  role: discussion
  weeks: [9]
  title: "π*0.6: a VLA That Learns From Experience"
  authors: "Physical Intelligence"
  year: 2025
  venue: "arXiv"            # arXiv 2511.14759 (technical report, no venue)
  url: https://arxiv.org/abs/2511.14759
  summary: "Makes a vision-language-action model improve from its own deployments by reinforcement learning. A value function, trained on demonstrations, autonomous attempts and human corrections, scores every action; the policy is trained on all of that data with one extra input saying whether an action's advantage beat a threshold, and at test time it is asked for the good ones."
  contributions:
    - "RECAP: collect rollouts with outcome labels and optional human interventions, fit a value function, then retrain the policy conditioned on a binarized advantage, and repeat (Sec. IV, Algorithm 1)."
    - "Advantage conditioning as policy extraction: unlike policy gradients it needs no tractable likelihood, so it works with flow-matching action experts, and unlike weighted regression it keeps every sample (Sec. IV-B, Eq. 3)."
    - "A multi-task distributional value function predicting steps to success, from a smaller VLM backbone (Sec. IV-A, Fig. 4)."
    - "More than doubled throughput and roughly halved failure rates on the hardest tasks; espresso drinks made for 13 hours straight (Abstract, Sec. I)."
  connects_to: "The worked example on advantage conditioning on this page; the guest's talk on π0.7, which conditions on episode metadata in the same spirit; and the RL of Weeks 4–5 applied to a generalist policy."

# Key papers from the Week 9 lecture (cards written from the abstracts).
- id: octo
  role: lecture
  weeks: [9]
  title: "Octo: An Open-Source Generalist Robot Policy"
  authors: "Octo Model Team (Ghosh, Walke, Pertsch, Black, Mees et al.)"
  year: 2024
  venue: "RSS"              # Robotics: Science and Systems XX, roboticsproceedings.org/rss20/p090
  url: https://arxiv.org/abs/2405.12213
  summary: "An open transformer policy trained on 800k trajectories from the Open X-Embodiment data. It takes language instructions or goal images, and is meant as a starting point: fine-tune it to a robot with new sensors or a new action space in a few hours on a consumer GPU."
  contributions:
    - "Language or goal-image conditioning in one model, trained by goal-conditioned behavior cloning with a diffusion action head (Abstract; lecture)."
    - "Fine-tuning to new observation and action spaces by adding input tokens or a new head, evaluated on 9 robot platforms (Abstract)."
    - "Released weights and code, with ablations of architecture and data to guide later generalist models (Abstract)."
  connects_to: "The lecture's main architecture; on this page, the pooled network with a new head added for a new robot."

- id: crossformer
  role: lecture
  weeks: [9]
  title: "Scaling Cross-Embodied Learning: One Policy for Manipulation, Navigation, Locomotion and Aviation"
  authors: "Doshi, Walke, Mees, Dasari & Levine"
  year: 2024
  venue: "CoRL"             # PMLR 270:496-512 (8th Conference on Robot Learning)
  url: https://arxiv.org/abs/2408.11812
  summary: "CrossFormer, one transformer trained on about 900k trajectories from 20 embodiments, from arms to wheeled robots, quadcopters and quadrupeds. Observations of any kind become tokens, and each embodiment family has its own action head, so no observation or action spaces have to be aligned by hand."
  contributions:
    - "A single set of weights controlling manipulators, wheeled robots, quadcopters and quadrupeds (Abstract)."
    - "Matches specialist policies trained for each embodiment, and beats earlier cross-embodiment methods (Abstract)."
    - "Embodiment-specific readout heads that predict action chunks of different lengths, for control rates from 5 to 50 Hz (lecture)."
  connects_to: "The multi-head network of this page's first toy, and the 'heads' side of the heads-versus-padding diagram."

- id: lbm
  role: lecture
  weeks: [9]
  title: "A Careful Examination of Large Behavior Models for Multitask Dexterous Manipulation"
  authors: "TRI LBM Team"
  year: 2025
  venue: "arXiv"            # arXiv 2507.05331, a TRI report; one search found no venue
  url: https://arxiv.org/abs/2507.05331
  summary: "Toyota Research Institute's study of whether multitask pretraining helps dexterous manipulation. Diffusion-transformer policies are pretrained on simulated and real robot data and compared with single-task policies in blind, randomized real-world trials analysed for statistical confidence."
  contributions:
    - "An evaluation pipeline built for statistical confidence: blind, randomized comparisons in simulation and on real robots (Abstract)."
    - "Multitask pretraining makes policies more successful and robust, and lets them learn new complex tasks with less data (Abstract)."
    - "Performance improves predictably as pretraining scale and diversity grow (Abstract)."
  connects_to: "The new-robot curve on this page: pretraining helps most when the new task has little data. The lecture also quotes its finding that data normalization mattered more than architecture."

- id: pi0
  role: lecture
  weeks: [9]
  title: "π0: A Vision-Language-Action Flow Model for General Robot Control"
  authors: "Black et al. (Physical Intelligence)"
  year: 2025
  venue: "RSS"              # arXiv comment: "Published in RSS 2025"
  url: https://arxiv.org/abs/2410.24164
  summary: "A VLA that grafts a flow-matching action expert onto a pretrained vision-language model, so it keeps the VLM's web knowledge and outputs continuous action chunks. It is trained on a large mixture of data from several dexterous robots."
  contributions:
    - "A flow-matching architecture on top of a pretrained VLM, producing continuous actions rather than tokens (Abstract)."
    - "Pretraining on many dexterous robot platforms, then evaluated zero-shot, on language following, and after fine-tuning (Abstract)."
    - "Long dexterous tasks such as folding laundry, clearing tables and assembling boxes (Abstract)."
  connects_to: "The 'padded action space' side of the heads-versus-padding diagram, and Week 6's flow matching put to work."

- id: pi05
  role: lecture
  weeks: [9]
  title: "π0.5: a Vision-Language-Action Model with Open-World Generalization"
  authors: "Physical Intelligence (Black et al.)"
  year: 2025
  venue: "CoRL"             # PMLR 305:17-40 (9th Conference on Robot Learning)
  url: https://arxiv.org/abs/2504.16054
  summary: "Builds on π0 with co-training on very mixed data: several robots, high-level subtask prediction, and web data. The claim is that this transfer is what makes the policy generalize to homes it has never seen."
  contributions:
    - "Co-training on multi-robot data, semantic subtask prediction and web data in one model (Abstract)."
    - "An end-to-end learned system cleaning kitchens and bedrooms in entirely new homes, which the authors call a first (Abstract)."
  connects_to: "The lecture's 'current VLA recipe' diagram, together with knowledge insulation; the base of the guest's π0.6 and π0.7."

- id: knowledge-insulation
  role: lecture
  weeks: [9]
  title: "Knowledge Insulating Vision-Language-Action Models: Train Fast, Run Fast, Generalize Better"
  authors: "Driess et al."
  year: 2025
  venue: "NeurIPS"          # NeurIPS 2025 poster 117079; mlanthology neurips/2025
  url: https://arxiv.org/abs/2505.23705
  summary: "Asks what happens to a VLM's knowledge when a continuous action expert is bolted onto it, and finds that naive training slows learning and loses semantic transfer. The fix trains the backbone on discrete action tokens and web data, while the action expert reads the backbone without sending gradients into it."
  contributions:
    - "Shows that adding a diffusion or flow-matching action expert without precautions hurts both training speed and knowledge transfer (Abstract)."
    - "Knowledge insulation: next-token prediction for the backbone, a stop-gradient between backbone and action expert (Abstract; lecture)."
  connects_to: "The stop-gradient in the 'current VLA recipe' diagram and equation on this page; Week 7's FAST tokens are the backbone's action targets."

- id: simpler
  role: lecture
  weeks: [9]
  title: "Evaluating Real-World Robot Manipulation Policies in Simulation"
  authors: "Li, Hsu, Gu, Pertsch, Mees et al."
  year: 2024
  venue: "CoRL"             # PMLR 270:3705-3728 (8th Conference on Robot Learning)
  url: https://arxiv.org/abs/2405.05941
  summary: "SIMPLER, simulated versions of common real robot setups, built to tell which of several real-world policies is better without running them on hardware. Instead of full digital twins it narrows two gaps: control (by system identification) and vision (by green-screening real backgrounds and matching textures)."
  contributions:
    - "Identifies the control gap and the visual gap as the main obstacles to trustworthy simulated evaluation, and ways to reduce them without a full digital twin (Abstract)."
    - "The mean maximum rank violation (MMRV), a ranking metric that weighs each misordered pair by its real-world gap (Sec. III, Eqs. 1–2)."
    - "Paired sim and real evaluations over about 1,500 episodes showing strong correlation, including under distribution shifts (Abstract)."
  connects_to: "This page's second toy, which ranks policies in a miscalibrated and a calibrated simulator and scores them with MMRV."

