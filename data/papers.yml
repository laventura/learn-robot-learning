# --- Week 3 · Imitation Learning ------------------------------------------
- id: causal-confusion
  role: discussion
  weeks: [3]
  title: "Causal Confusion in Imitation Learning"
  authors: "de Haan, Jayaraman & Levine"
  year: 2019
  venue: "NeurIPS"
  url: https://arxiv.org/abs/1905.11979
  summary: "Giving a cloned policy more information can make it worse. With extra inputs, a network can reach low training error by relying on a signal that only correlates with the expert's action, such as a dashboard brake light that comes on after the expert brakes, and then fails once its own actions change what it sees."
  contributions:
    - "Names the failure, causal misidentification, and shows it in benchmark control tasks and a driving setting: the policy with more inputs does worse (Sec. 3)."
    - "Trains one network that masks its inputs according to a randomly sampled causal graph, so a single model holds a policy for every hypothesis about which inputs matter (Sec. 4.1)."
    - "Picks the right hypothesis with targeted interventions, using either environment reward or expert queries; in query mode it needs far fewer queries than DAgger (Sec. 2, Sec. 4.2)."
  connects_to: "The lecture's drawer example, where a policy keys on a 10 N force spike instead of the grasped handle, and solved problem 5 on this page."

- id: visual-imitation-representations
  role: discussion
  weeks: [3]
  title: "The Surprising Effectiveness of Representation Learning for Visual Imitation"
  authors: "Pari, Shafiullah, Arunachalam & Pinto"
  year: 2022                # TODO(venue): RSS per Semantic Scholar; year believed 2022 (arXiv Dec 2021)
  venue: "RSS"
  url: https://arxiv.org/abs/2112.01511
  summary: "Splits visual behavior cloning into two separate jobs. First, an image encoder is trained with self-supervised learning on offline images; then, with no further training, the action for a new image is a distance-weighted average of the actions of its nearest demonstration frames in the encoder's feature space (VINN)."
  contributions:
    - "A simple visual imitation method: a self-supervised (BYOL-style) encoder plus non-parametric locally weighted regression over the demonstrations (Sec. I)."
    - "Competitive with end-to-end behavior cloning on offline pushing, stacking and door-opening data (Sec. I)."
    - "On a real robot opening doors from 71 demonstrations: 80% success on doors seen in the data and 40% in new scenes, against 53.3% and 3.3% for the strongest baselines (Sec. I)."
  connects_to: "It keeps the behavioral-cloning recipe of copying demonstrated actions, but moves the hardest part, learning what to look at in an image, into a separate step that needs no action labels."

- id: transporter-networks
  role: discussion
  weeks: [3]
  title: "Transporter Networks: Rearranging the Visual World for Robotic Manipulation"
  authors: "Zeng et al."
  year: 2020
  venue: "CoRL"
  url: https://arxiv.org/abs/2010.14406
  summary: "Treats pick-and-place as choosing pixels in a top-down view of the scene. One network scores every pixel as a place to pick; a second finds where to put the object by matching features cropped around the pick against the rest of the scene, at several rotations."
  contributions:
    - "An action space that keeps the image's spatial layout: actions are pixel locations and rotations, so what is learned at one position carries over to others (Sec. 1, Sec. 3)."
    - "Over 90% success on most of 10 simulated tabletop tasks from 100 demonstrations, where end-to-end baselines struggle with the same data (Sec. 1)."
    - "Its score maps can rank several good pick or place locations at once, so the policy can represent multimodal choices (Abstract)."
    - "Releases Ravens, a simulated benchmark for these tasks (Sec. 1)."
  connects_to: "A score map over pixels is a discretized action distribution, like the binned policy on this page: it can keep several good options as separate peaks instead of averaging them."

- id: dagger
  role: lecture
  weeks: [3]
  title: "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning"
  authors: "Ross, Gordon & Bagnell"
  year: 2011
  venue: "AISTATS"
  url: https://arxiv.org/abs/1011.0686
  summary: "Explains why copying an expert's actions can go badly wrong (a learner's mistakes take it to states the expert never showed, so errors compound) and introduces DAgger: repeatedly run the current policy, have the expert label the states it visits, add them to the data, and retrain. The result is a single deterministic policy with guarantees under the states it actually encounters."
  contributions:
    - "Recalls that a classifier with mistake rate ε on the expert's states can make on the order of εT² mistakes over T steps on its own states (Sec. 1)."
    - "DAgger (Dataset Aggregation), an iterative algorithm that trains one stationary, deterministic policy on the aggregated data from all rounds (Sec. 3)."
    - "Casts imitation as no-regret online learning and shows that any no-regret learner, under reduction assumptions, finds a policy that performs well on the states it induces (Abstract, Sec. 4)."
    - "Experiments on steering in the Super Tux Kart racing game, playing Super Mario Bros., and a sequence-labelling benchmark (Sec. 1, Sec. 5)."
  connects_to: "The εT² bound and the DAgger loop on this page; the road toy measures both."

- id: end-to-end-driving
  role: lecture
  weeks: [3]
  title: "End to End Learning for Self-Driving Cars"
  authors: "Bojarski et al."
  year: 2016
  venue: "arXiv"
  url: https://arxiv.org/abs/1604.07316
  summary: "NVIDIA trained a convolutional network to map the image from a front-facing camera straight to a steering command, using only human driving as supervision. To teach recovery, the training images include views shifted off the lane centre and rotated, each labelled with a corrective steering command."
  contributions:
    - "An end-to-end behavioral cloning system (DAVE-2), with no hand-designed lane detection or path planning, running at 30 frames per second (Abstract)."
    - "Recovery data without crashing: two off-centre views come from left and right cameras, and further shifts and rotations are synthesised by viewpoint transformation (Sec. 2, Sec. 5.2)."
    - "Reports driving autonomously about 98% of the time on a route in New Jersey, measured by counting interventions (Sec. 7.2)."
  connects_to: "The side-camera trick in the Intuition section and solved problem 3: synthetic recovery data instead of an expert in the loop."

- id: play-lmp
  role: lecture
  weeks: [3]
  title: "Learning Latent Plans from Play"
  authors: "Lynch et al."
  year: 2019
  venue: "CoRL"
  url: https://arxiv.org/abs/1903.01973
  summary: "Instead of recording demonstrations of specific tasks, operators teleoperate a robot freely (play). Play-LMP learns from windows of this data relabelled with their own final state as the goal, and organizes the different ways of reaching a goal in a latent plan space, which it samples from at test time."
  contributions:
    - "Argues that play data are cheap (no task segmentation, labels or resets) and rich, covering about 4 times more interaction space than task demonstrations collected in the same time (Abstract)."
    - "Play-LMP: a goal-conditioned latent-variable policy trained with a plan-recognition posterior, a plan-proposal prior and an action decoder (Abstract, Sec. 1)."
    - "On 18 simulated visual manipulation tasks, a single play-trained policy substantially outperforms individual expert-trained policies, and it is more robust to perturbations (Abstract)."
  connects_to: "The goal-conditioned, latent-variable policy behind the ELBO equation on this page, and the lecture's play-data case study."

